[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ai-systems-lab"
version = "0.1.0"
description = "Beginner-friendly, local-first experiments for understanding AI systems"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
